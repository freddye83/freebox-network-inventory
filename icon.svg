<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fond Carré Arrondi Rouge Free -->
  <rect width="512" height="512" rx="100" fill="#CC0000"/>
  
  <!-- Symbole Réseau / Router Freebox (Blanc) -->
  <g fill="#FFFFFF">
    <!-- Nœud Central (Box) -->
    <rect x="206" y="206" width="100" height="100" rx="20"/>
    
    <!-- Lignes de Connexion Réseau -->
    <path d="M 256 110 L 256 206 M 256 306 L 256 402 M 110 256 L 206 256 M 306 256 L 402 256" 
          stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
          
    <!-- Nœuds d'inventaire (Appareils connectés) -->
    <circle cx="256" cy="90" r="32"/>
    <circle cx="256" cy="422" r="32"/>
    <circle cx="90" cy="256" r="32"/>
    <circle cx="422" cy="256" r="32"/>
