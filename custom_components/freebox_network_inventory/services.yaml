set_static_lease:
  fields:
    mac:
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    ip:
      required: true
      example: "192.168.1.50"
      selector:
        text:
    comment:
      required: false
      example: "NAS"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: freebox_network_inventory

remove_static_lease:
  fields:
    mac:
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: freebox_network_inventory
